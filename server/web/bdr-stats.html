<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westgate BDR Board</title>
<meta name="robots" content="noindex">

<link rel="icon" href="brand/world-mark-filled.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=WDXL+Lubrifont+JP+N&display=swap">
<style>
  @font-face { font-family: "42dot Sans"; src: url("fonts/42dotSans-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "42dot Sans"; src: url("fonts/42dotSans-Medium.woff2") format("woff2"); font-weight: 500 700; font-display: swap; }
  :root {
    --paper: #e5e0d1; --paper-dark: #d7d1c1; --white: #fff; --ink: #111114; --ink-line: rgba(17,17,20,.25); --muted: #53524f;
    --red: #dc0025; --navy: #001939; --green: #0b6b2f; --amber: #8a5a00;
    --display: "Saira", Arial, sans-serif; --label: "WDXL Lubrifont JP N", Arial, sans-serif; --sans: "42dot Sans", Helvetica, system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper) url("brand/paper-grain.svg") repeat; color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
  .brand { font-family: var(--label); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
  h1 { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: clamp(30px, 5vw, 48px); line-height: .95; letter-spacing: -.01em; margin: 6px 0 0; }
  .sub { color: var(--muted); font-size: 14px; }
  .when { font-family: var(--label); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .team { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 22px 0 28px; }
  .tile { background: var(--white); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 14px 16px; }
  .tile .k { font-family: var(--label); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; margin-top: 4px; }
  .tile .v.red { color: var(--red); }
  .tile .s { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .bdr { background: var(--white); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 16px 18px 14px; position: relative; }
  .bdr.p1 { border-color: var(--red); box-shadow: 5px 5px 0 var(--red); }
  .rank { position: absolute; top: -12px; left: 14px; background: var(--ink); color: var(--paper); font-family: var(--display); font-weight: 700; font-size: 13px; padding: 2px 9px; }
  .bdr.p1 .rank { background: var(--red); color: #fff; }
  .name { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .name b { font-family: var(--display); font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: -.01em; }
  .pts { font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--red); line-height: 1; white-space: nowrap; }
  .pts small { font-family: var(--label); font-size: 10px; letter-spacing: .12em; color: var(--muted); margin-left: 4px; }
  .funnel { margin: 12px 0 8px; display: flex; flex-direction: column; gap: 7px; }
  .row { display: grid; grid-template-columns: 118px 1fr 44px 54px; align-items: center; gap: 8px; font-size: 13px; }
  .row .l { font-weight: 600; }
  .bar { height: 12px; background: var(--paper-dark); border: 1px solid var(--ink-line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--navy); }
  .row.rfq .bar i { background: var(--red); }
  .row .n { font-family: var(--display); font-weight: 700; font-size: 16px; text-align: right; }
  .row .a { font-family: var(--label); font-size: 10.5px; letter-spacing: .06em; color: var(--muted); text-align: right; white-space: nowrap; }
  .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px dashed var(--ink-line); padding-top: 8px; margin-top: 8px; color: var(--muted); font-size: 12.5px; }
  .foot b { color: var(--ink); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .legend { margin-top: 26px; color: var(--muted); font-size: 12.5px; }
  @media (max-width: 480px) { .row { grid-template-columns: 100px 1fr 40px 50px; } .name b { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Westgate Supply</div>
      <h1>BDR board</h1>
      <div class="sub" id="sub">Pipeline built and RFQs brought in, this month.</div>
    </div>
    <div class="when" id="when">Loading…</div>
  </header>
  <section class="team" id="team"></section>
  <section class="board" id="board"><div class="empty">Loading the board…</div></section>
  <p class="legend" id="legend"></p>
</div>
<script>
(function () {
  const el = (tag, attrs = {}, kids = []) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "text") n.textContent = v; else if (k === "class") n.className = v; else n.setAttribute(k, v); } for (const k of kids) if (k) n.append(k); return n; };
  const num = (n) => Number(n || 0).toLocaleString();
  const month = new Date().toLocaleDateString([], { month: "long" });
  document.getElementById("sub").textContent = "Pipeline built and RFQs brought in, " + month + ".";
  function tile(k, v, s, red) { return el("div", { class: "tile" }, [el("div", { class: "k", text: k }), el("div", { class: "v" + (red ? " red" : ""), text: num(v) }), s ? el("div", { class: "s", text: s }) : null]); }
  function row(label, n, all, max, cls) {
    const w = max ? Math.max(2, Math.round(100 * n / max)) : 0;
    return el("div", { class: "row " + (cls || "") }, [el("span", { class: "l", text: label }), el("div", { class: "bar" }, [el("i", { style: "width:" + w + "%" })]), el("span", { class: "n", text: num(n) }), el("span", { class: "a", text: num(all) + " all" })]);
  }
  function draw(data) {
    const reps = (data.reps || []).slice().sort((a, b) => (b.month.points - a.month.points) || (b.all.points - a.all.points));
    const sum = (k) => reps.reduce((n, r) => n + (r.month[k] || 0), 0);
    const team = document.getElementById("team");
    team.replaceChildren(
      tile("RFQs this month", sum("rfqs"), sum("firstRfqs") + " from new companies", true),
      tile("Buyers reached", sum("reached"), "real conversations with the buyer"),
      tile("Buyers named", sum("named"), "new purchasing contacts found"),
      tile("Cards to a buyer", sum("cards"), "line cards in a buyer's inbox"),
      tile("Dials", sum("dials"), reps.length + " BDRs"),
    );
    const maxNamed = Math.max(1, ...reps.map((r) => r.month.named)), maxRfq = Math.max(1, ...reps.map((r) => r.month.rfqs));
    const board = document.getElementById("board");
    if (!reps.length) { board.replaceChildren(el("div", { class: "empty", text: "Nothing on the board yet. The first day's numbers land tonight." })); return; }
    board.replaceChildren(...reps.map((r, i) => el("article", { class: "bdr" + (i === 0 && r.month.points > 0 ? " p1" : "") }, [
      el("span", { class: "rank", text: "#" + (i + 1) }),
      el("div", { class: "name" }, [el("b", { text: r.first }), el("span", { class: "pts" }, [document.createTextNode(num(r.month.points)), el("small", { text: "pts " + month })])]),
      el("div", { class: "funnel" }, [
        row("Buyers named", r.month.named, r.all.named, maxNamed),
        row("Cards to buyer", r.month.cards, r.all.cards, maxNamed),
        row("Buyers reached", r.month.reached, r.all.reached, maxNamed),
        row("RFQs in", r.month.rfqs, r.all.rfqs, maxRfq, "rfq"),
      ]),
      el("div", { class: "foot" }, [
        el("span", {}, [document.createTextNode("New companies: "), el("b", { text: num(r.month.firstRfqs) })]),
        el("span", {}, [document.createTextNode("Dials: "), el("b", { text: num(r.month.dials) })]),
        r.best ? el("span", {}, [document.createTextNode("Best day: "), el("b", { text: num(r.best.points) + " pts" })]) : null,
      ]),
    ])));
    const p = data.points || {};
    document.getElementById("legend").textContent = "Points: a dial " + (p.dial || 1) + ", a buyer named " + (p.named || 3) + ", the card to them " + (p.card || 2) + ", the buyer reached " + (p.reached || 5) + ", an RFQ " + (p.rfq || 30) + " and " + (p.firstRfq || 10) + " more for a company's first. Each paid once per company.";
    document.getElementById("when").textContent = "Updated " + new Date(data.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  async function load() {
    try { const r = await fetch("/api/public/bdr-stats", { cache: "no-store" }); if (!r.ok) throw new Error(r.status); draw(await r.json()); }
    catch (e) { document.getElementById("when").textContent = "Couldn't load the board"; }
  }
  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
