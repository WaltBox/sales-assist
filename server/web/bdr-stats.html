<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westgate BDR Board</title>
<meta name="robots" content="noindex">

<link rel="icon" href="brand/world-mark-filled.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=WDXL+Lubrifont+JP+N&display=swap">
<style>
  @font-face { font-family: "42dot Sans"; src: url("fonts/42dotSans-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "42dot Sans"; src: url("fonts/42dotSans-Medium.woff2") format("woff2"); font-weight: 500 700; font-display: swap; }
  :root {
    --paper: #e5e0d1; --paper-dark: #d7d1c1; --white: #fff; --ink: #111114; --ink-line: rgba(17,17,20,.25); --muted: #53524f;
    --red: #dc0025; --navy: #001939; --green: #0b6b2f;
    --display: "Saira", Arial, sans-serif; --label: "WDXL Lubrifont JP N", Arial, sans-serif; --sans: "42dot Sans", Helvetica, system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper) url("brand/paper-grain.svg") repeat; color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
  .brand { font-family: var(--label); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
  h1 { font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: clamp(30px, 5vw, 48px); line-height: .95; letter-spacing: -.01em; margin: 6px 0 0; }
  .when { font-family: var(--label); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .toggle { display: flex; gap: 0; margin: 18px 0 22px; }
  .toggle button { font: inherit; font-family: var(--label); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding: 9px 16px; background: var(--white); border: 2px solid var(--ink); border-right-width: 0; color: var(--ink); cursor: pointer; }
  .toggle button:last-child { border-right-width: 2px; }
  .toggle button.on { background: var(--ink); color: var(--paper); }
  .team { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 28px; }
  .tile { background: var(--white); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 14px 16px; }
  .tile .k { font-family: var(--label); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; margin-top: 4px; }
  .tile .v.red { color: var(--red); }
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .bdr { background: var(--white); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 16px 18px 14px; position: relative; }
  .bdr.p1 { border-color: var(--red); box-shadow: 5px 5px 0 var(--red); }
  .rank { position: absolute; top: -12px; left: 14px; background: var(--ink); color: var(--paper); font-family: var(--display); font-weight: 700; font-size: 13px; padding: 2px 9px; }
  .bdr.p1 .rank { background: var(--red); color: #fff; }
  .name { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .name b { font-family: var(--display); font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: -.01em; }
  .pts { font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--red); line-height: 1; white-space: nowrap; }
  .pts small { font-family: var(--label); font-size: 10px; letter-spacing: .12em; color: var(--muted); margin-left: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px 14px; margin-top: 14px; }
  .cell .k { font-family: var(--label); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .cell .v { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; }
  .cell.rfq .v { color: var(--red); }
  .foot { border-top: 1px dashed var(--ink-line); padding-top: 8px; margin-top: 12px; color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .foot b { color: var(--ink); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Westgate Supply</div>
      <h1>BDR board</h1>
    </div>
    <div class="when" id="when">Loading…</div>
  </header>
  <div class="toggle" id="toggle"></div>
  <section class="team" id="team"></section>
  <section class="board" id="board"><div class="empty">Loading the board…</div></section>
</div>
<script>
(function () {
  const el = (tag, attrs = {}, kids = []) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "text") n.textContent = v; else if (k === "class") n.className = v; else if (k === "onclick") n.onclick = v; else n.setAttribute(k, v); } for (const k of kids) if (k) n.append(k); return n; };
  const num = (n) => Number(n || 0).toLocaleString();
  const RANGES = [["today", "Today"], ["week", "This week"], ["month", "This month"], ["all", "All time"]];
  let range = (() => { try { return localStorage.getItem("bdr-range") || "week"; } catch { return "week"; } })();
  let data = null;
  function cell(k, v, cls) { return el("div", { class: "cell " + (cls || "") }, [el("div", { class: "k", text: k }), el("div", { class: "v", text: num(v) })]); }
  function tile(k, v, red) { return el("div", { class: "tile" }, [el("div", { class: "k", text: k }), el("div", { class: "v" + (red ? " red" : ""), text: num(v) })]); }
  function draw() {
    document.getElementById("toggle").replaceChildren(...RANGES.map(([k, label]) => el("button", { class: k === range ? "on" : "", text: label, onclick: () => { range = k; try { localStorage.setItem("bdr-range", k); } catch {} draw(); } })));
    if (!data) return;
    const reps = (data.reps || []).map((r) => ({ ...r, t: r[range] || {} })).sort((a, b) => (b.t.points || 0) - (a.t.points || 0) || (b.all.points || 0) - (a.all.points || 0));
    const sum = (k) => reps.reduce((n, r) => n + (r.t[k] || 0), 0);
    document.getElementById("team").replaceChildren(
      tile("RFQs", sum("rfqs"), true), tile("New companies", sum("firstRfqs")), tile("Buyers reached", sum("reached")), tile("Buyers named", sum("named")), tile("Cards to a buyer", sum("cards")), tile("Dials", sum("dials")),
    );
    const board = document.getElementById("board");
    if (!reps.length) { board.replaceChildren(el("div", { class: "empty", text: "Nothing on the board yet." })); return; }
    const label = RANGES.find((x) => x[0] === range)[1].toLowerCase();
    board.replaceChildren(...reps.map((r, i) => el("article", { class: "bdr" + (i === 0 && r.t.points > 0 ? " p1" : "") }, [
      el("span", { class: "rank", text: "#" + (i + 1) }),
      el("div", { class: "name" }, [el("b", { text: r.first }), el("span", { class: "pts" }, [document.createTextNode(num(r.t.points)), el("small", { text: "pts " + label })])]),
      el("div", { class: "grid" }, [
        cell("RFQs", r.t.rfqs, "rfq"), cell("New companies", r.t.firstRfqs), cell("Dials", r.t.dials),
        cell("Buyers named", r.t.named), cell("Cards to a buyer", r.t.cards), cell("Buyers reached", r.t.reached),
      ]),
      el("div", { class: "foot" }, [
        r.best ? el("span", {}, [document.createTextNode("Best day: "), el("b", { text: num(r.best.points) + " pts, " + new Date(r.best.day + "T12:00:00").toLocaleDateString([], { month: "short", day: "numeric" }) })]) : el("span"),
        r.since ? el("span", {}, [document.createTextNode("Since "), el("b", { text: new Date(r.since + "T12:00:00").toLocaleDateString([], { month: "short", day: "numeric" }) })]) : null,
      ]),
    ])));
    document.getElementById("when").textContent = "Updated " + new Date(data.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  async function load() {
    try { const r = await fetch("/api/public/bdr-stats", { cache: "no-store" }); if (!r.ok) throw new Error(r.status); data = await r.json(); draw(); }
    catch (e) { document.getElementById("when").textContent = "Couldn't load the board"; }
  }
  draw();
  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
